secrets:
  vaultwarden_push_id:
    external: true
  vaultwarden_push_key:
    external: true
  vaultwarden_smtp_pass:
    external: true

services:
  app:
    image: vaultwarden/server
    environment:
      # PUSH
      - PUSH_ENABLED=true
      - PUSH_INSTALLATION_ID_FILE=/run/secrets/vaultwarden_push_id
      - PUSH_INSTALLATION_KEY_FILE=/run/secrets/vaultwarden_push_key
      - PUSH_RELAY_URI=https://push.bitwarden.com
      - PUSH_IDENTITY_URI=https://identity.bitwarden.com
      # SMTP
      - SMTP_FROM_NAME=Astrum-Vaultwarden
      - SMTP_PORT=587
      - SMTP_SECURITY=starttls
      - SMTP_HOST=smtp.office365.com
      - SMTP_FROM=${VW_SMTP_FROM:?Please set the VW_SMTP_FROM environment variable}
      - SMTP_USERNAME=${VW_SMTP_USERNAME:?Please set the VW_SMTP_USERNAME environment variable}
      - SMTP_PASSWORD_FILE=/run/secrets/vaultwarden_smtp_pass
      - DOMAIN=https://${APP_DOMAIN:?Please set the APP_DOMAIN environment variable}
      - TZ=${TZ:-America/Sao_Paulo}
    # ports:
      # - 80:80
    volumes:
      - ${DOCKER_ROOT}/volumes/vaultwarden:/data/
    networks:
      traefik_proxy:
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == ${NODE_HOSTNAME:?Please set the NODE_HOSTNAME environment variable}
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vault.rule=Host(`${APP_DOMAIN}`)"
        - "traefik.http.routers.vault.entrypoints=websecure"
        - "traefik.http.routers.vault.tls=true"
        - "traefik.http.routers.vault.service=vault"
        - "traefik.http.services.vault.loadbalancer.server.port=80"

networks:
  traefik_proxy:
    external: true
    