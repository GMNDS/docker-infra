services:
  app:
    image: vaultwarden/server
    environment:
      #- ADMIN_TOKEN=REDACTED_ADMIN_TOKEN
      - PUSH_ENABLED=true
      - PUSH_INSTALLATION_ID=REDACTED_PUSH_INSTALLATION_ID
      - PUSH_INSTALLATION_KEY= REDACTED_PUSH_INSTALLATION_KEY
      - PUSH_RELAY_URI=https://push.bitwarden.com
      - PUSH_IDENTITY_URI=https://identity.bitwarden.com
      - SMTP_HOST=smtp.office365.com
      - SMTP_FROM=redacted@example.com
      - SMTP_PORT=587
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=redacted@example.com
      - SMTP_PASSWORD=REDACTED_SMTP_PASSWORD  
      - DOMAIN=https://vault.asterimoon.com
      - TZ=America/Sao_Paulo
        #- ADMIN_TOKEN=REDACTED_ADMIN_TOKEN
    # ports:
      # - 83:80
    volumes:
      - ${DOCKER_ROOT}/volumes/vaultwarden:/data/
    networks:
      # vaultwarden:
      traefik_proxy:
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: ["node.role == manager"]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vault.rule=Host(`vault.asterimoon.com`) || Host(`vault.astrum.app.br`)"
        - "traefik.http.routers.vault.entrypoints=websecure"
        - "traefik.http.routers.vault.tls=true"
        - "traefik.http.routers.vault.service=vault"
        - "traefik.http.services.vault.loadbalancer.server.port=80"

networks:
#   vaultwarden:
#     name: vaultwarden
  traefik_proxy:
    external: true
    
