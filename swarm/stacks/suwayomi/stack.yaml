secrets:
  suwayomi_auth_password:
    external: true
  yomikage_auth_password:
    external: true

services:

  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:preview

    environment:
      - TZ=America/Sao_Paulo
      - EXTENSION_REPOS=["https://github.com/keiyoushi/extensions/blob/repo/index.min.json"]
      - AUTH_MODE=ui_login
      - AUTH_USERNAME=${SUWAYOMI_AUTH_USERNAME:?Defina SUWAYOMI_AUTH_USERNAME}
      - AUTH_PASSWORD_FILE=/run/secrets/suwayomi_auth_password
      - DEBUG=true
      - BIND_IP=0.0.0.0
      - BIND_PORT=4567
      - SOCKS_PROXY_ENABLED=false
      - DOWNLOAD_AS_CBZ=true
      - LOGGING=file
      - BASIC_AUTH_ENABLED=false
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191

    secrets:
      - suwayomi_auth_password

    volumes:
      - ${DOCKER_ROOT}/volumes/suwayomi/media/downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${DOCKER_ROOT}/volumes/suwayomi/media/local:/home/suwayomi/.local/share/Tachidesk/local
      - ${DOCKER_ROOT}/volumes/suwayomi/files:/home/suwayomi/.local/share/Tachidesk

    networks:
      - traefik_proxy

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.labels.media == true

      restart_policy:
        condition: on-failure
        max_attempts: 3

      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik_proxy

        - traefik.http.routers.suwayomi.rule=Host(`${APP_DOMAIN:?Defina APP_DOMAIN}`)
        - traefik.http.routers.suwayomi.entrypoints=websecure
        - traefik.http.routers.suwayomi.tls=true

        - traefik.http.services.suwayomi.loadbalancer.server.port=4567

  yomikage:
    image: ghcr.io/suwayomi/tachidesk:preview

    environment:
      - TZ=America/Sao_Paulo
      - EXTENSION_REPOS=["https://github.com/keiyoushi/extensions/blob/repo/index.min.json"]
      - AUTH_MODE=ui_login
      - AUTH_USERNAME=${YOMIKAGE_AUTH_USERNAME:?Defina YOMIKAGE_AUTH_USERNAME}
      - AUTH_PASSWORD_FILE=/run/secrets/yomikage_auth_password
      - DEBUG=true
      - BIND_IP=0.0.0.0
      - BIND_PORT=4567
      - SOCKS_PROXY_ENABLED=false
      - DOWNLOAD_AS_CBZ=true
      - LOGGING=file
      - BASIC_AUTH_ENABLED=false
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191

    secrets:
      - yomikage_auth_password

    volumes:
      - ${DOCKER_ROOT}/volumes/suwayomi/yomikage:/home/suwayomi/.local/share/Tachidesk

    networks:
      - traefik_proxy

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.labels.media == true

      restart_policy:
        condition: on-failure
        max_attempts: 3

      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik_proxy

        - traefik.http.routers.yomikage.rule=Host(`${YOMIKAGE_APP_DOMAIN:?Defina YOMIKAGE_APP_DOMAIN}`)
        - traefik.http.routers.yomikage.entrypoints=websecure
        - traefik.http.routers.yomikage.tls=true

        - traefik.http.services.yomikage.loadbalancer.server.port=4567

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest

    environment:
      - TZ=America/Sao_Paulo

    networks:
      - traefik_proxy

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.labels.media == true

      restart_policy:
        condition: any

networks:
  traefik_proxy:
    external: true
