version: "3.7"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=REDACTED_POSTGRES_PASSWORD
      - TZ=America/Sao_Paulo
      - PG_MAX_CONNECTIONS=500
    networks:
      - traefik_proxy
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${DOCKER_ROOT}/volumes/chatwoot/init_pg:/docker-entrypoint-initdb.d
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
         # - node.hostname == worker1
      # resources:
      #   limits:
      #     cpus: "1"
      #     memory: 3072M

volumes:
  postgres_data:
    external: true
    name: postgres_data

networks:
  traefik_proxy:
    external: true

