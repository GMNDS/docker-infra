version: "3.7"

##############
#
# Para configurar o chatwoot, execute o comando abaixo no console do container:
#
# bundle exec rails db:chatwoot_prepare
#
# Variáveis de Ambiente:
#
# https://www.chatwoot.com/docs/self-hosted/configuration/environment-variables
#
#############

services:
  chatwoot_app:
    image: chatwoot/chatwoot:v4.9.1 ## Versão do Chatwoot
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    entrypoint: docker/entrypoints/rails.sh
    volumes:
      - chatwoot_data:/app/storage ## Diretório dos arquivos de conversa
      - chatwoot_public:/app ## Diretório de todos os arquivos do chatwoot
    networks:
      - traefik_proxy ## Nome da rede interna
    environment:
      - CHATWOOT_HUB_URL=https://chat.astrum.app.br #
      - INSTALLATION_NAME=Astrum ## Nome da empresa
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=REDACTED_SECRET_KEY_BASE ## Key aleatória gerada aleatóriamente
      - FRONTEND_URL=https://chat.astrum.app.br ## Url do Chatwoot
      # - DEFAULT_LOCALE=pt_BR
      - FORCE_SSL=true
      - ENABLE_ACCOUNT_SIGNUP=false ## false = Desativar novas inscrições no inicio | true = Ativar novas inscrições no inicio
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=REDACTED_POSTGRES_PASSWORD ## Senha do postgres
      - POSTGRES_DATABASE=chatwoot
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_LOG_TO_STDOUT=true
      - USE_INBOX_AVATAR_FOR_BOT=true
      # Performance
      - SIDEKIQ_CONCURRENCY=10
      - RACK_TIMEOUT_SERVICE_TIMEOUT=0
      - RAILS_MAX_THREADS=5
      - WEB_CONCURRENCY=2
      - ENABLE_RACK_ATTACK=false
      - WEBHOOKS_TRIGGER_TIMEOUT=40
      # Servidor de Email Gmail
      - MAILER_SENDER_EMAIL=redacted@example.com
      - SMTP_DOMAIN=gmail.com
      - SMTP_ADDRESS=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=redacted@example.com
      - SMTP_PASSWORD=REDACTED_SMTP_PASSWORD
      - SMTP_AUTHENTICATION=login
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - SMTP_OPENSSL_VERIFY_MODE=peer
      - MAILER_INBOUND_EMAIL_DOMAIN=redacted@example.com
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 2048M
      labels:
        - traefik.enable=true

        # Chatwoot 
        - traefik.http.routers.chatwoot_app.rule=Host(`chat.astrum.app.br`)
        - traefik.http.routers.chatwoot_app.entrypoints=websecure
        - traefik.http.routers.chatwoot_app.tls=true
        - traefik.http.routers.chatwoot_app.service=chatwoot_service

        # Help center
        - traefik.http.routers.chatwoot_help.rule=Host(`help.astrum.app.br`)
        - traefik.http.routers.chatwoot_help.entrypoints=websecure
        - traefik.http.routers.chatwoot_help.tls=true
        - traefik.http.routers.chatwoot_help.service=chatwoot_service

        # Chatwoot Service
        - traefik.http.services.chatwoot_service.loadbalancer.server.port=3000 
        - traefik.http.services.chatwoot_service.loadbalancer.passhostheader=true 

  chatwoot_sidekiq:
    image: chatwoot/chatwoot:v4.9.1 ## Versão do Chatwoot
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - chatwoot_data:/app/storage ## Diretório dos arquivos de conversa
      - chatwoot_public:/app ## Diretório de todos os arquivos do chatwoot
    networks:
      - traefik_proxy ## Nome da rede interna
    environment:
      - CHATWOOT_HUB_URL=https://chat.astrum.app.br #
      - INSTALLATION_NAME=Astrum ## Nome da empresa
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=REDACTED_SECRET_KEY_BASE ## Key aleatória gerada aleatóriamente
      - FRONTEND_URL=https://chat.astrum.app.br ## Url do Chatwoot
      - DEFAULT_LOCALE=pt_BR
      - FORCE_SSL=true
      - ENABLE_ACCOUNT_SIGNUP=false ## false = Desativar novas inscrições no inicio | true = Ativar novas inscrições no inicio
      - REDIS_URL=redis://redis:6379
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=REDACTED_POSTGRES_PASSWORD ## Senha do postgres
      - POSTGRES_DATABASE=chatwoot
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_LOG_TO_STDOUT=true
      - USE_INBOX_AVATAR_FOR_BOT=true
      # Performance
      - SIDEKIQ_CONCURRENCY=10
      - RACK_TIMEOUT_SERVICE_TIMEOUT=0
      - RAILS_MAX_THREADS=5
      - WEB_CONCURRENCY=2
      - ENABLE_RACK_ATTACK=false
      - WEBHOOKS_TRIGGER_TIMEOUT=40
      # Servidor de Email Gmail
      - MAILER_SENDER_EMAIL=Chatwoot <redacted@example.com>
      - SMTP_DOMAIN=gmail.com
      - SMTP_ADDRESS=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=redacted@example.com
      - SMTP_PASSWORD=REDACTED_SMTP_PASSWORD
      - SMTP_AUTHENTICATION=login
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - SMTP_OPENSSL_VERIFY_MODE=peer
      - MAILER_INBOUND_EMAIL_DOMAIN=redacted@example.com
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 2048M

volumes:
  chatwoot_data:
    external: true
    name: chatwoot_data
  chatwoot_public:
    external: true
    name: chatwoot_public

networks:
  traefik_proxy:
    external: true
