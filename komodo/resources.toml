[[stack]]
name = "asteri-auth"
deploy = true
[stack.config]
server = "asteri-is"
git_provider = "github.com"
git_account = "gmnds"
repo = "gmnds/docker-infra"
branch = "main"
run_directory = "compose/asteri-auth"
file_paths = ["compose.yaml"]

